# ────────────────────────────────────────────────────────────────────────────
# Operator class distribution
# ────────────────────────────────────────────────────────────────────────────
# v6.6 — rebalanced against FAA FY2024 Air Traffic By The Numbers:
# - GA = ~42% of 38.9M tower ops nationally
# - Military = 2-4% of FAA tower ops historically
# - Part 135 air taxi = 15-25% of tower ops
# - Part 121 air carrier (commercial+cargo) = 30-40% of tower ops, 60-70% of
#   center ops
# Original v5 mix had military at 8% (2x reality) and GA at 25% (under by ~15
# pts). Reviewers in v6.4 found military callsign/airframe mismatches
# (CAP/F-35, Reach/F-16, Pat/F-35) as the dominant remaining failure class —
# cutting military weight directly reduces that error class proportionally.
operator_weights:
  commercial: 42.0   # Part 121 — was 45
  cargo: 6.0         # subset of Part 121 — was 7
  ga: 30.0           # Part 91 — was 25, bumped to match tower reality
  business: 10.0     # Part 135 charter — was 5, was way underweight
  military: 4.0      # all services — was 8 (2x FAA reality)
  training: 5.0      # subset of GA, separate for callsign telephony — was 7
  rotorcraft: 2.0    # unchanged
  medevac: 1.0       # unchanged

# NOTE: per-class callsign prefixes used to live here. They've moved to
# src/radiotalk/data/seed/operators.csv, sourced from FAA JO 7340.2 Chapter 3
# §3 plus a small supplementary list. See scripts/build_operators_csv.py and
# radiotalk.data.operators.prefixes_by_class(). ga and training classes still
# fall through to US N-numbers (no FAA designator).

# ────────────────────────────────────────────────────────────────────────────
# Event distribution: ~80% routine, ~15% abnormals, ~5% emergencies, ~1% rare
# ────────────────────────────────────────────────────────────────────────────
event_weights:
  routine: 80.0
  go_around: 2.0
  missed_approach: 1.5
  runway_change: 1.5
  hold: 1.5
  traffic_advisory: 3.0
  weather_deviation: 2.0
  pirep: 1.5
  equipment_issue: 1.0
  navigation_issue: 1.0
  emergency_medical: 1.2
  emergency_mechanical: 0.9
  emergency_fuel: 0.5
  emergency_bird_strike: 0.4
  emergency_fire: 0.4
  emergency_pressurization: 0.3
  emergency_hydraulic: 0.3
  emergency_electrical: 0.3
  emergency_flight_control: 0.3
  nordo: 0.3
  minimum_fuel_advisory: 0.4
  diversion: 0.3
  priority_handling: 0.3

# ────────────────────────────────────────────────────────────────────────────
# Traffic + roster
# ────────────────────────────────────────────────────────────────────────────
# v6.6 — tier-1+2 hubs dominate sampling (per us.yaml airport_tiers), so
# the long tail of "light"-density small airports is no longer over-
# represented. Bump heavy and moderate, trim light.
traffic_density_weights:
  light: 20      # was 30
  moderate: 50   # unchanged
  heavy: 30      # was 20

# Number of aircraft on the frequency, by traffic density. Bumped upper
# bounds: at major hubs during peak, a frequency commonly has 8-12 aircraft.
traffic_aircraft_range:
  light: [1, 2]
  moderate: [2, 5]      # was [2, 4]
  heavy: [5, 10]        # was [5, 8]

# ────────────────────────────────────────────────────────────────────────────
# Phase + frequency bands
# ────────────────────────────────────────────────────────────────────────────
# v6.6 — was equal 1:1:1:1:1 which is wildly unrealistic. Real-world ATC
# VHF voice (what ASR training actually targets):
# - Tower + approach dominate the captured / listenable / interesting
#   traffic (LiveATC-style feeds, ATCO2 corpus, MITRE study).
# - Center is much sparser (mostly silent IFR cruise; long checkins
#   between facilities).
# - Ground is high-volume but procedurally simpler.
# - Ramp is private frequencies not normally captured for ASR training.
# Weighted to roughly match what's publicly captured + what an ASR model
# actually needs heavy coverage on.
phase_weights:
  tower: 30      # most varied ATC activity, was 1
  approach: 25   # high-density vectoring + ILS, was 1
  ground: 20     # high-volume taxi, was 1
  center: 15     # en-route handoffs, sparse, was 1
  ramp: 10       # pushback only, limited, was 1

# VHF aircraft band assignments per phase (MHz).
phase_frequency_bands:
  ground: [121.6, 121.9]
  tower: [118.0, 120.9]
  approach: [119.0, 127.9]
  center: [128.0, 135.9]
  ramp: [129.0, 131.9]

# ────────────────────────────────────────────────────────────────────────────
# Time of day
# ────────────────────────────────────────────────────────────────────────────
# v6.6 — real US ATC traffic by hour: ~70% daytime (6am-7pm), ~25% night,
# ~5% dawn+dusk combined. Slight diversity bias toward night for ASR.
time_of_day_weights:
  day: 65      # was 55
  night: 25    # unchanged
  dawn: 5      # was 10
  dusk: 5      # was 10

# ────────────────────────────────────────────────────────────────────────────
# Runway + procedure naming
# ────────────────────────────────────────────────────────────────────────────
# Runway heading is uniform 1..36; this picks the side suffix.
runway_suffix_weights:
  "": 60
  L: 15
  R: 15
  C: 10

# Probability the focal aircraft has no SID/STAR in approach/tower/center phases.
# (ground/ramp phases are always None regardless of this value.)
# v2/p3: set to 0.9 (10% of scenarios get a SID). The sampler still
# synthesizes random 4-letter codes (a real CIFP-sourced registry is future
# work), but the new WAYPOINT PRONUNCIATION rule in prompt_system.txt teaches
# the model to phonetically transform whatever code appears. Combined with
# thinking mode, this produces reasonable spoken forms even for synthesized
# codes — much better than the v1 fake-then-letter-spelled outputs.
sid_star_none_chance: 0.9

# ────────────────────────────────────────────────────────────────────────────
# Weather
# ────────────────────────────────────────────────────────────────────────────
weather:
  # v6.6 — real US commercial year-round average is ~85% VMC / ~15% IMC.
  # Previous 75/25 over-sampled IMC for phraseology diversity, but with
  # v6.x the model now handles IMC phraseology well; rebalance to reality.
  vmc_imc_weights:
    VMC: 82
    IMC: 18
  vmc_vis_sm: [5.0, 10.0]
  imc_vis_sm: [0.25, 3.0]
  vmc_ceiling_chance: 0.4         # P(ceiling != null | VMC)
  vmc_ceiling_ft: [5000, 20000]
  imc_ceiling_ft: [100, 2000]
  altimeter_inhg: [29.50, 30.40]
  wind_dir_deg: [0, 360]
  # Tri-bucket wind sampler — pick a bucket then uniform within range.
  wind_kt_buckets:
    - {range: [0, 10], weight: 60}
    - {range: [10, 25], weight: 30}
    - {range: [25, 45], weight: 10}
