# US region config — defaults for `radiotalk data generate --config us`.
# Every knob the ScenarioSampler reads at runtime lives here. Edit this file
# (or copy it to a new region YAML) to retune distributions without touching code.

name: us
allowed_regions: [us]

# ────────────────────────────────────────────────────────────────────────────
# Airport weighting
# ────────────────────────────────────────────────────────────────────────────
# TierWeighter assigns weights to airports based on their tier below.
# Anything not listed in `airport_tiers` gets `tier_weights.default`.
tier_weights:
  "1": 50.0      # major hubs
  "2": 10.0      # regionals
  default: 0.0   # v6.3: zero-weight the long tail. The default bucket was
                 # ~10000 small/uncontrolled airports, and at weight 1.0
                 # dominated sampling — ~80% of generated scenarios hit a
                 # gravel strip or uncontrolled field, producing widebody-at-
                 # tiny-airport scenarios and fabricated Tower controllers at
                 # CTAF-only fields. Zeroing this restricts sampling to the
                 # 85 named tier 1+2 airports (all towered, all with TRACON
                 # or Center coverage), eliminating the dominant remaining
                 # realism failure class.

airport_tiers:
  # ─── Tier 1 — major US hubs ───
  KATL: 1
  KLAX: 1
  KORD: 1
  KDFW: 1
  KDEN: 1
