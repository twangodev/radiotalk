[project]
name = "radiotalk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "airportsdata>=20260315",
    "hf-transfer>=0.1.9",
    "num2words>=0.5.13",
    "numpy>=2.4.4",
    "pyarrow>=24.0.0",
    "pydantic>=2",
    "rich>=15.0.0",
    "typer>=0.24.1",
]

[project.optional-dependencies]
data = [
    "openai>=2.32.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
]
voices = [
    "datasets>=4.8.4",
    "soundfile>=0.13.1",
    "torch>=2.11.0",
    "torchcodec>=0.11.1",
]
audio = [
    "datasets>=4.8.4",
    "hume-tada",
    "soundfile>=0.13.1",
    "torch>=2.11.0",
    "torchcodec>=0.11.1",
    "transformers<5",
]
hf = [
    "hf-transfer>=0.1.9",
    "huggingface-hub>=1.11.0",
]

[tool.uv.sources]
hume-tada = { git = "https://github.com/twangodev/tada", branch = "main" }

[tool.uv]
conflicts = [
    [{ extra = "hf" }, { extra = "audio" }],
]

[project.scripts]
radiotalk = "radiotalk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radiotalk"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
